defaults:
  - base
  # - override /env: cropenv
  # - override /gflownet: trajectorybalance
  # - override /loss: trajectorybalance
  # - override /proxy: box/hartmann
  # - override /logger: wandb


_target_: gflownet.envs.crop_env.CropEnv


# Environment
env:
  growth_step: 1
  growth_period: 2

# Buffer
buffer:
  test:
    type: uniform
    n: 1000
    seed: 0

# GFlowNet hyperparameters
gflownet:
  random_action_prob: 0.1
  optimizer:
    batch_size:
      forward: 100
    lr: 0.001
    # z_dim: 16
    # lr_z_mult: 100
    n_train_steps: 10000

# Policy
policy:
  forward:
    type: mlp
    n_hid: 256
    n_layers: 3
    checkpoint: forward
  backward:
    shared_weights: False
    type: mlp
    n_hid: 256
    n_layers: 3
    checkpoint: backward

# Evaluator
evaluator:
  first_it: False
  period: 500
  n: 1000
  checkpoints_period: 500

id: cropenv
# Dimensions of hypergrid
# n_dim: 2
# # Number of cells per dimension
# length: 3
# # Maximum increment per each dimension that can be done by one action
# max_increment: 1
# # Maximum number of dimensions that can be incremented by one action
# max_dim_per_action: 1
# # Mapping coordinates
# cell_min: -1
# cell_max: 1
