defaults:
  - base

_target_: gflownet.envs.greenhouse.sim_env.CropSimEnv

growth_step: 30
growth_period: 2

# Buffer
buffer:
  test:
    type: uniform
    n: 100
    seed: 0
  replay:
    capacity: 5000

# Policy — 5-step trajectory, small discrete action space
# Network doesn't need to be huge
policy:
  forward:
    type: mlp
    n_hid: 128
    n_layers: 2
    checkpoint: forward
  backward:
    shared_weights: False
    type: mlp
    n_hid: 128
    n_layers: 2
    checkpoint: backward

# Evaluator — log frequently since training is fast with cache
evaluator:
  first_it: True
  period: 100
  n: 100
  checkpoints_period: 1000

id: simenv