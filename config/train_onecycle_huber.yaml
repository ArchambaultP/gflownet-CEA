
defaults:
  - env: simenv
  - gflownet: flowmatch
  - loss: flowmatching
  - policy: mlp_${gflownet}
  - proxy: cropSimulation_huber
  - logger: base
  - user: default
  - evaluator: base
  - buffer: base
  - _self_

device: cuda
float_precision: 32
n_samples: 100
seed: 2

policy:
  backward:
    type: fixed
    fixed_output: [0.0]

optimizer:
  forward: 16
  backward_replay: 16

env:
  precomputed: True
  step_fraction: 0.3

gflownet:
  optimizer:
    n_train_steps: 200
    lr_z_mult: 1

proxy:
  reward_transform: softmin
  beta: 10
  loss_type: huber_relative
  huber_delta: 1.0
  relative_floor_frac: 0.05
  relative_floor_abs: 1e-6

hydra:
  run:
    dir: ${user.logdir.root}/${oc.env:SLURM_JOB_ID,local}/${now:%Y-%m-%d_%H-%M-%S_%f}
  sweep:
    dir: ${user.logdir.root}/${oc.env:SLURM_JOB_ID,local}/multirun/${now:%Y-%m-%d_%H-%M-%S_%f}
  job:
    chdir: False
  sweeper:
    params:
      seed: 0
      proxy.beta: 5, 10, 15
      env.step_fraction: 0.15, 0.3
      gflownet.optimizer.lr_z_mult: 1
      gflownet.optimizer.lr: 1e-3, 5e-4
      gflownet.random_action_prob: 0.2, 0.5, 0.8
