defaults:
  - env: simenv
  - gflownet: trajectorybalance
  - loss: trajectorybalance
  - policy: mlp_${gflownet}
  - proxy: cropSimulation_thresholded
  - logger: wandb_artifact
  - user: default
  - evaluator: base
  - buffer: base
  - _self_

device: cuda
float_precision: 32
n_samples: 100
seed: 0

policy:
  forward:
    n_hid: 256
    n_layers: 3
  backward:
    type: fixed
    fixed_output: [0.0]

optimizer:
  forward: 16
  backward_replay: 16

env:
  precomputed: True
  step_fraction: 0.15

gflownet:
  optimizer:
    n_train_steps: 1000
    lr_z_mult: 1

proxy:
  loss_norm: q10q90
  q_low: 0.10
  q_high: 0.90
  tau_quantile: 0.05
  threshold_temperature: 0.05
  reward_epsilon: 1e-3

hydra:
  run:
    dir: ${user.logdir.root}/${oc.env:SLURM_JOB_ID,local}/${now:%Y-%m-%d_%H-%M-%S_%f}
  sweep:
    dir: ${user.logdir.root}/${oc.env:SLURM_JOB_ID,local}/multirun/${now:%Y-%m-%d_%H-%M-%S_%f}
  job:
    chdir: False
  sweeper:
    params:
      seed: 0
      gflownet.optimizer.lr_z_mult: 1
      gflownet.optimizer.lr: 5e-4
      gflownet.random_action_prob: 0.2
      proxy.tau_quantile: 0.10
      proxy.threshold_temperature: 0.15
      proxy.reward_cache_path: precomputed/reward_table_sf0.15_thresholded_q10_T015.json
