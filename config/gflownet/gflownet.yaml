_target_: gflownet.gflownet.GFlowNetAgent

seed: ${seed}

optimizer:
  # Learning rate — sweep over [1e-4, 5e-4, 1e-3]
  lr: 5e-4
  lr_decay_period: 10000
  lr_decay_gamma: 0.5
  method: adam
  adam_beta1: 0.9
  adam_beta2: 0.999
  sgd_momentum: 0.9
  z_dim: 16
  lr_z_mult: 100

  batch_size:
    # With cached rewards (precomputed directory), larger batches are free
    forward: 64
    backward_dataset: 0
    # Replay buffer helps DB loss see diverse transitions
    backward_replay: 16

  train_to_sample_ratio: 1
  # 20k steps — with cached rewards this runs in minutes
  n_train_steps: 20000
  bootstrap_tau: 0.0
  clip_grad_norm: 1.0

state_flow: null
mask_invalid_actions: True
temperature_logits: 1.0

# 10% random actions for exploration — helps avoid mode collapse
random_action_prob: 0.1

replay_sampling: permutation
train_sampling: permutation
use_context: False
garbage_collection_period: 0
collect_reversed_logprobs: False